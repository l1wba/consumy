[package]
name = "dashboard-gastos"
version = "0.6.4"
description = "consumy - controle local de entradas e despesas"
authors = ["you"]
edition = "2021"

[lib]
name = "dashboard_gastos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.dev]
debug = 0
